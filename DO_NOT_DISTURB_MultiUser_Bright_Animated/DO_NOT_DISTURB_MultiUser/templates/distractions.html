{% extends "base.html" %}{% block content %}<div class="heading"><div><small>NOTICE WITHOUT JUDGEMENT</small><h1>Distraction tracker</h1><p>Learn about patterns without blaming yourself.</p></div></div><div class="card"><form method="post" class="inline"><label class="grow">What distracted you?<input name="label" required maxlength="120" placeholder="Social media"></label><label>Minutes<input type="number" name="minutes" min="0" max="1440" value="10" required></label><button class="btn">Log distraction +</button></form></div><div class="card"><h2>Recent entries</h2>{% for e in entries %}<div class="row"><span>↗</span><div><b>{{e.label}}</b><small>{{e.minutes}} minutes · {{e.created_at}}</small></div></div>{% else %}<p>No entries yet.</p>{% endfor %}</div>{% endblock %}
