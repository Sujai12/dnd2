{% extends "base.html" %}{% block content %}<div class="heading"><div><small>MAKE IT MANAGEABLE</small><h1>Your task planner</h1><p>Your tasks are private to your account.</p></div></div><div class="card"><form method="post" class="inline"><input type="hidden" name="action" value="add"><label class="grow">Task title<input name="title" required maxlength="160" placeholder="Review chapter 3"></label><label>Due date<input type="date" name="due_date"></label><label>Priority<select name="priority"><option>Normal</option><option>Low</option><option>High</option></select></label><button class="btn">Add task +</button></form></div><div class="card"><h2>All tasks</h2>{% for t in tasks %}<div class="row"><form method="post"><input type="hidden" name="action" value="toggle"><input type="hidden" name="id" value="{{t.id}}"><button class="tick">{{'✓' if t.done else '○'}}</button></form><div class="grow"><b class="{{'strike' if t.done else ''}}">{{t.title}}</b><small>{{t.due_date or 'No due date'}} · {{t.priority}}</small></div><form method="post" data-confirm="Delete this task?"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{t.id}}"><button class="ghost">×</button></form></div>{% else %}<p>No tasks yet.</p>{% endfor %}</div>{% endblock %}
